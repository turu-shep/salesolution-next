            - heading "QR codes everywhere they look" [level=3] [ref=e166]
            - paragraph [ref=e167]: On the truck wrap. Stuck to the furnace you just installed. Printed on the parts-counter receipt. The bumper of the loaner car. Customers scan once and you're in their phone forever.
          - generic [ref=e169]:
            - img [ref=e171]
            - heading "A microsite that doesn't look like 2014" [level=3] [ref=e174]
            - paragraph [ref=e175]: Your services, your story, your photos, your booking flow, your reviews — all on a real website your customers can save, share, and come back to. No agency required. No web designer to chase.
          - generic [ref=e177]:
            - img [ref=e179]
            - heading "Book without a phone call" [level=3] [ref=e182]
            - paragraph [ref=e183]: Customers pick a time, a service, a tech, a tier — on their phone, when they're thinking about it. Not when your office is open. Not after sitting on hold. Bookings happen at 11pm on a Tuesday because they can.
          - generic [ref=e185]:
            - img [ref=e187]
            - heading "Sell expertise over video" [level=3] [ref=e190]
            - paragraph [ref=e191]: A homeowner sends a 90-second clip of a flickering panel and pays $89 for an answer. A counter customer dials in for a 15-minute fitment consult. Your senior people make money on their experience without leaving the building.
          - generic [ref=e193]:
            - img [ref=e195]
            - heading "A customer agent that knows your shop" [level=3] [ref=e197]
            - paragraph [ref=e198]: Trained on your services, your products, your hours, your service area. Answers the inbound questions your team is too busy to handle — and politely routes the real ones to the right person.
          - generic [ref=e200]:
            - img [ref=e202]
            - heading "Reviews on autopilot" [level=3] [ref=e204]
            - paragraph [ref=e205]: Every closed job triggers a review request through the channel the customer actually uses. Your Google rating climbs without anyone on your team chasing it.
          - generic [ref=e207]:
            - img [ref=e209]
            - heading "Re-engagement on your terms" [level=3] [ref=e212]
            - paragraph [ref=e213]: Send the boiler-tune-up reminder in October. The brake-check email at 50,000 miles. The "your filter is probably due" SMS at the 90-day mark. To your list. Not to Google's ad auction.
          - generic [ref=e215]:
            - img [ref=e217]
            - heading "Get paid before the truck rolls" [level=3] [ref=e221]
            - paragraph [ref=e222]: Diagnostic fees, deposits, service plans, retainers — all collected on the microsite before any work happens. The relationship and the revenue start on the same screen.
