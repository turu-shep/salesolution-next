        - generic [ref=e115]:
          - heading "Where Your Customers Go" [level=2] [ref=e116]
          - paragraph [ref=e117]: You did the work. You earned the trust. Then the relationship evaporates — because nothing was built to keep it alive.
        - generic [ref=e118]:
          - generic [ref=e120]:
            - img [ref=e121]
            - heading "One-and-done customers" [level=3] [ref=e124]
            - paragraph [ref=e125]: The HVAC system gets installed. The transmission gets fixed. The customer walks out of the parts counter with their order. There's no system pulling them back — and they don't need you again until something breaks.
          - generic [ref=e127]:
            - img [ref=e128]
            - heading "Acquisition keeps getting more expensive" [level=3] [ref=e130]
            - paragraph [ref=e131]: Google Ads costs in trades have roughly doubled in a decade. Yelp and Angi commoditized the lead. You're paying more every quarter to find customers you've probably already served once.
          - generic [ref=e133]:
            - img [ref=e134]
            - heading "Your customer list is invisible to your own team" [level=3] [ref=e139]
            - paragraph [ref=e140]: It's scattered across ServiceTitan exports, the counter person's memory, a spreadsheet someone made in 2021, and a stack of paper invoices in the back office. Nobody can actually use it.
          - generic [ref=e142]:
            - img [ref=e143]
            - heading "Competitors are one Google search away" [level=3] [ref=e147]
            - paragraph [ref=e148]: When the customer needs you again, they don't remember your name. They search "HVAC repair near me" — and the cheapest ad wins. Your relationship had no anchor in their pocket.
      - generic [ref=e150]:
        - generic [ref=e152]:
          - heading "What You Use To Keep Them" [level=2] [ref=e153]
          - paragraph [ref=e154]: Eight tools, one platform. None of them ask your customer to learn anything new — they just give them an easier way to come back.
        - generic [ref=e156]:
