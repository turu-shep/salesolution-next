            - heading "Trucks Roll For Problems You Could Have Solved On A Video Call" [level=3] [ref=e305]
            - paragraph [ref=e306]: Half your dispatches are diagnostics a tech could have handled live. Fuel, hours, and crew capacity — gone.
          - generic [ref=e308]:
            - img [ref=e309]
            - heading "Customers Only Call You In Emergencies" [level=3] [ref=e311]
            - paragraph [ref=e312]: Between jobs you're invisible. They Google in a panic — and the first ad wins, not you.
          - generic [ref=e314]:
            - img [ref=e315]
            - heading "Senior Techs' Diagnostic Gold Leaves With Them" [level=3] [ref=e320]
            - paragraph [ref=e321]: When your top tech retires or quits, twenty years of judgment walks out the door. The next crew starts from scratch.
          - generic [ref=e323]:
