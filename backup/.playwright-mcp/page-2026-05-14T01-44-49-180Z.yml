        - generic [ref=e110]:
          - heading "Where Your Customers Go" [level=2] [ref=e111]
          - paragraph [ref=e112]: You did the work. You earned the trust. Then the relationship evaporates — because nothing was built to keep it alive.
        - generic [ref=e113]:
          - generic [ref=e115]:
            - img [ref=e116]
            - heading "One-and-done customers" [level=3] [ref=e119]
            - paragraph [ref=e120]: The HVAC system gets installed. The transmission gets fixed. The customer walks out of the parts counter with their order. There's no system pulling them back — and they don't need you again until something breaks.
          - generic [ref=e122]:
            - img [ref=e123]
            - heading "Acquisition keeps getting more expensive" [level=3] [ref=e125]
            - paragraph [ref=e126]: Google Ads costs in trades have roughly doubled in a decade. Yelp and Angi commoditized the lead. You're paying more every quarter to find customers you've probably already served once.
          - generic [ref=e128]:
            - img [ref=e129]
            - heading "Your customer list is invisible to your own team" [level=3] [ref=e134]
            - paragraph [ref=e135]: It's scattered across ServiceTitan exports, the counter person's memory, a spreadsheet someone made in 2021, and a stack of paper invoices in the back office. Nobody can actually use it.
          - generic [ref=e137]:
            - img [ref=e138]
            - heading "Competitors are one Google search away" [level=3] [ref=e142]
            - paragraph [ref=e143]: When the customer needs you again, they don't remember your name. They search "HVAC repair near me" — and the cheapest ad wins. Your relationship had no anchor in their pocket.
      - generic [ref=e145]:
        - generic [ref=e147]:
          - heading "What You Use To Keep Them" [level=2] [ref=e148]
          - paragraph [ref=e149]: Eight tools, one platform. None of them ask your customer to learn anything new — they just give them an easier way to come back.
        - generic [ref=e151]:
