          - heading "Where Your Customers Go" [level=2] [ref=e132]
          - paragraph [ref=e133]: You did the work. You earned the trust. Then the relationship evaporates — because nothing was built to keep it alive.
        - generic [ref=e134]:
          - generic [ref=e136]:
            - img [ref=e137]
            - heading "One-and-done customers" [level=3] [ref=e140]
            - paragraph [ref=e141]: The HVAC system gets installed. The transmission gets fixed. The customer walks out of the parts counter with their order. There's no system pulling them back — and they don't need you again until something breaks.
          - generic [ref=e143]:
            - img [ref=e144]
            - heading "Acquisition keeps getting more expensive" [level=3] [ref=e146]
            - paragraph [ref=e147]: Google Ads costs in trades have roughly doubled in a decade. Yelp and Angi commoditized the lead. You're paying more every quarter to find customers you've probably already served once.
          - generic [ref=e149]:
            - img [ref=e150]
            - heading "Your customer list is invisible to your own team" [level=3] [ref=e155]
            - paragraph [ref=e156]: It's scattered across ServiceTitan exports, the counter person's memory, a spreadsheet someone made in 2021, and a stack of paper invoices in the back office. Nobody can actually use it.
          - generic [ref=e158]:
            - img [ref=e159]
            - heading "Competitors are one Google search away" [level=3] [ref=e163]
            - paragraph [ref=e164]: When the customer needs you again, they don't remember your name. They search "HVAC repair near me" — and the cheapest ad wins. Your relationship had no anchor in their pocket.
      - generic [ref=e166]:
        - generic [ref=e168]:
          - heading "What You Use To Keep Them" [level=2] [ref=e169]
          - paragraph [ref=e170]: Eight tools, one platform. None of them ask your customer to learn anything new — they just give them an easier way to come back.
        - generic [ref=e172]:
