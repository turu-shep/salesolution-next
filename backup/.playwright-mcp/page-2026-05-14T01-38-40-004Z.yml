            - heading "QR codes everywhere they look" [level=3] [ref=e182]
            - paragraph [ref=e183]: On the truck wrap. Stuck to the furnace you just installed. Printed on the parts-counter receipt. The bumper of the loaner car. Customers scan once and you're in their phone forever.
          - generic [ref=e185]:
            - img [ref=e187]
            - heading "A microsite that doesn't look like 2014" [level=3] [ref=e190]
            - paragraph [ref=e191]: Your services, your story, your photos, your booking flow, your reviews — all on a real website your customers can save, share, and come back to. No agency required. No web designer to chase.
          - generic [ref=e193]:
            - img [ref=e195]
            - heading "Book without a phone call" [level=3] [ref=e198]
            - paragraph [ref=e199]: Customers pick a time, a service, a tech, a tier — on their phone, when they're thinking about it. Not when your office is open. Not after sitting on hold. Bookings happen at 11pm on a Tuesday because they can.
          - generic [ref=e201]:
            - img [ref=e203]
            - heading "Sell expertise over video" [level=3] [ref=e206]
            - paragraph [ref=e207]: A homeowner sends a 90-second clip of a flickering panel and pays $89 for an answer. A counter customer dials in for a 15-minute fitment consult. Your senior people make money on their experience without leaving the building.
          - generic [ref=e209]:
            - img [ref=e211]
            - heading "A customer agent that knows your shop" [level=3] [ref=e213]
            - paragraph [ref=e214]: Trained on your services, your products, your hours, your service area. Answers the inbound questions your team is too busy to handle — and politely routes the real ones to the right person.
          - generic [ref=e216]:
            - img [ref=e218]
            - heading "Reviews on autopilot" [level=3] [ref=e220]
            - paragraph [ref=e221]: Every closed job triggers a review request through the channel the customer actually uses. Your Google rating climbs without anyone on your team chasing it.
          - generic [ref=e223]:
            - img [ref=e225]
            - heading "Re-engagement on your terms" [level=3] [ref=e228]
            - paragraph [ref=e229]: Send the boiler-tune-up reminder in October. The brake-check email at 50,000 miles. The "your filter is probably due" SMS at the 90-day mark. To your list. Not to Google's ad auction.
          - generic [ref=e231]:
