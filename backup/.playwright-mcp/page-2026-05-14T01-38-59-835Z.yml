      - generic [ref=e126]:
        - generic [ref=e128]:
          - heading "The Shortage Isn’t A Phase" [level=2] [ref=e129]
          - paragraph [ref=e130]: You’re not crazy. You’re not failing at hiring. The world has changed and the math is brutal.
        - generic [ref=e132]:
          - generic [ref=e134]:
            - generic [ref=e135]:
              - img [ref=e137]
              - generic [ref=e142]: Field service
            - heading "Your master tech is retiring." [level=3] [ref=e143]
            - paragraph [ref=e144]: He's 58. He's been with you 22 years. He carries the diagnostic instinct that closes the hard jobs. When he walks, the knowledge walks — and the kid you hired six months ago is two years from being able to replace him.
          - generic [ref=e146]:
            - generic [ref=e147]:
              - img [ref=e149]
              - generic [ref=e152]: Service shops
            - heading "You can't find mechanics." [level=3] [ref=e153]
            - paragraph [ref=e154]: You've been hiring for the second bay for nine months. Two no-shows. One who lasted three weeks. Meanwhile your A-tech is working 55-hour weeks and starting to look at the door. The labor market isn't getting easier — it's getting structurally worse for the next decade.
          - generic [ref=e156]:
            - generic [ref=e157]:
              - img [ref=e159]
              - generic [ref=e164]: Counter retail
            - heading "The 20-year counter person knows things nobody wrote down." [level=3] [ref=e165]
            - paragraph [ref=e166]: Cross-references, fitment quirks, customer history, the supplier rep on Tuesdays. When she retires, your new hire will stare blankly at half the questions that walk through the door. It will take them three years to rebuild that intuition. You don't have three years.
          - generic [ref=e168]:
            - generic [ref=e169]:
              - img [ref=e171]
              - generic [ref=e173]: All of you
            - heading "This is structural, not cyclical." [level=3] [ref=e174]
            - paragraph [ref=e175]: ~10,000 boomers retire every day. Trade school enrollment cratered after 2008 and hasn't recovered. The replacement ratio is 2 new trades workers entering for every 5 retiring — and that gap widens for the next 10 to 15 years before it bottoms out.
      - generic [ref=e177]:
        - generic [ref=e179]:
          - heading "Where The Knowledge Actually Lives" [level=2] [ref=e180]
          - paragraph [ref=e181]: It’s not in your CRM. It’s not in ServiceTitan. It’s not in a manual. It’s in the heads of the people you can’t afford to lose.
        - generic [ref=e182]:
          - generic [ref=e184]:
            - img [ref=e185]
            - heading "In Mike's head" [level=3] [ref=e187]
            - paragraph [ref=e188]: The instinct that says "check the start capacitor before you touch the board." The questions your senior tech asks the customer that the new hire wouldn't think to ask. The thirty-second mental flowchart that closes diagnostics in ten minutes instead of an hour.
          - generic [ref=e190]:
            - img [ref=e191]
            - heading "In two-minute conversations at the counter" [level=3] [ref=e195]
            - paragraph [ref=e196]: The fitment cross-reference your master parts person makes from memory. The "while you're here, you'll also want" upsell that lands every time. The way she handles the "is this gonna work on my truck" question without making the customer feel dumb.
          - generic [ref=e198]:
            - img [ref=e199]
            - heading "In quotes and objections nobody wrote down" [level=3] [ref=e202]
            - paragraph [ref=e203]: The four different ways your best estimator handles "your price is too high." The phone script that converts cold-callers into booked jobs. The exact words your top closer uses when the homeowner says "let me think about it" — which they do, every time.
          - generic [ref=e205]:
            - img [ref=e206]
            - heading "In the SOPs you've been \"meaning to write\" for five years" [level=3] [ref=e208]
            - paragraph [ref=e209]: The new-hire training nobody has time to build. The install checklist that lives in the shop manager's notebook. The complaint-handling flow that your office manager somehow keeps in her head. Knowledge that exists, but only inside one person — and only while that person still works there.
