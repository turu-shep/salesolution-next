              - text: »
              - strong [ref=e79]: How to Pick Mounting Style for Your Hydraulic Cylinder
          - generic [ref=e80]:
            - heading "How to Pick Mounting Style for Your Hydraulic Cylinder" [level=1] [ref=e82]
            - generic [ref=e83]: May 13, 2025
            - img "cylinder-mounting-style" [ref=e86]
            - generic [ref=e87]:
              - paragraph [ref=e88]: The first step in selecting a replacement cylinder is identifying what style of cylinder that you currently have. While many manufacturers utilize common style cylinders, many do not. Please see the figures below for the most readily available styles.
              - paragraph [ref=e89]:
                - text: If your cylinder is held together with four large bolts, you are in luck because this is the most common
                - strong [ref=e90]: tie-rod style cylinder
                - text: . The cylinder will have a clevis mount on the barrel end of the cylinder. The rod end mount is usually threaded to accept a clevis or possibly some other style of end. There are not as many options in this style of cylinder.
              - figure [ref=e92]
              - paragraph [ref=e93]:
                - text: If your cylinder has a welded body and has a clevis mount on each end it is a
                - strong [ref=e94]: welded-clevis
                - text: style cylinder. The cylinder will have a clevis mount on the barrel end of the cylinder, with the rod-end mount is usually threaded to accept a clevis or possibly some other style of end.
              - figure [ref=e96]
              - paragraph [ref=e97]:
                - text: If your cylinder has a welded body and has a short piece of pipe on each end it is
                - strong [ref=e98]: a welded-cross tube
                - text: style cylinder. The cylinder will have different widths on each end. You will want to place close attention to mounting widths and pin hole sizes to insure compatibility.
              - figure [ref=e100]
              - paragraph [ref=e101]:
                - text: If your cylinder has a hole drilled through the rod end of the cylinder, this is what is called a
                - strong [ref=e102]: pin-eye
                - text: style cylinder. These cylinders are commonly available with either a clevis mount or a cross-tube on the barrel end. You will want to place close attention to mounting widths and pin hole sizes to insure compatibility.
              - figure [ref=e104]
              - paragraph [ref=e105]:
                - text: If your cylinder has a swivel socket welded onto both ends of the cylinder, this is what is called a
                - strong [ref=e106]: Swivel-eye
                - text: style cylinder. These cylinders are commonly used where there is lateral movement between mounting points. You will want to place close attention to mounting widths and pin hole sizes to insure compatibility.
              - figure [ref=e108]
              - paragraph [ref=e109]:
                - text: If your cylinder has a welded body and has a short piece of pipe on the rod end and a thick flat piece with a pin hole through it on the barrel end, it is
                - strong [ref=e110]: a welded-tang
                - text: style cylinder. The cylinder will typically have the same width on each end. You will want to place close attention to mounting widths and pin hole sizes to insure compatibility.
              - figure [ref=e112]
              - paragraph [ref=e113]:
                - text: If your cylinder is mounted on lugs coming out of the side of the cylinder, this is what they would call a
                - strong [ref=e114]: trunnion
                - text: style cylinder. Trunnion mount cylinders are almost entirely exclusive to the manufacturer. You will need to get a replacement from the original manufacturer or contact a machine shop to recreate the mounts on a more common cylinder.
              - figure [ref=e116]
              - paragraph [ref=e117]:
                - text: Once you have determined the style of cylinder you are looking for, you will need to determine bore size, the mounting pin to pin length (both collapsed and extended), the rod diameter, and pin hole sizes. Drawings are usually available for individual cylinders to insure a proper fit. It might be necessary to have a local shop alter your frame to accept the cylinder, or alter the cylinder to fit your machine.
                - strong [ref=e118]: WARNING! Altering the cylinder in anyway will void any factory warranty.
